<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>En mantenimiento · Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Simonetta:ital,wght@0,400;0,900;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; font-synthesis:none}
  html,body{margin:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 18px;
    color:#f3e8d2; font-family:'Simonetta', Georgia, serif; letter-spacing:-.02em; text-align:center;
    background:#120910 radial-gradient(ellipse 120% 80% at 50% 0%, #3b1b36 0%, #1f0f1d 48%, #0e070d 100%) fixed;
  }
  main{max-width:520px; width:100%}
  h1{font-family:'Italianno', cursive; font-weight:400; letter-spacing:0; font-size:clamp(64px,15vw,104px); line-height:.9; margin:0; color:#f0d792; text-shadow:0 2px 22px rgba(214,178,94,.28)}
  .orn{display:flex; align-items:center; justify-content:center; gap:10px; color:#d6b25e; margin:12px 0 22px}
  .orn::before,.orn::after{content:""; width:70px; height:1px; background:linear-gradient(90deg, transparent, #d6b25e)}
  .orn::after{transform:scaleX(-1)}
  .msg{font-size:21px; line-height:1.45; margin:0 0 6px}
  .sub{font-style:italic; color:#c9b797; margin:0 0 26px; font-size:17px}
  figure{margin:0 auto; max-width:300px; padding:10px; border-radius:18px; border:1px solid rgba(214,178,94,.55);
    background:linear-gradient(#2a1426, #1c0d1a); box-shadow:0 20px 50px rgba(0,0,0,.5)}
  figure img{display:block; width:100%; height:auto; border-radius:10px}
  figcaption{font-family:'Italianno', cursive; letter-spacing:0; font-size:30px; color:#f0d792; margin-top:8px; line-height:1}
</style>
</head>
<body>
<main>
  <h1>En mantenimiento</h1>
  <div class="orn">✦</div>
  <p class="msg">Estamos realizando tareas de mantenimiento en la página.</p>
  <p class="sub">Volvemos pronto. Gracias por la paciencia.</p>
  <figure>
    <img src="mantenimiento.jpg" alt="Nuestro equipo técnico trabajando" width="599" height="1300">
    <figcaption>Nuestro equipo técnico trabajando</figcaption>
  </figure>
</main>
</body>
</html>
